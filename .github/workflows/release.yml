name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment Info
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Tests
        working-directory: app
        run: flutter test

      - name: Build Android Release APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-output
          cp app/build/app/outputs/flutter-apk/app-release.apk release-output/worship-player-release.apk
          echo "APK successfully built and prepared for release."

      - name: Upload Build Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: worship-player-apk
          path: release-output/worship-player-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-output/worship-player-release.apk
